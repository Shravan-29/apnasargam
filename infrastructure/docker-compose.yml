services:
  postgres:
    image: postgres:16
    container_name: apnasargam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apnasargam
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: apnasargam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apnasargam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: